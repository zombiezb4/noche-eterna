# Blueprint de Render para Noche Eterna — ADAPTADO DE VERDAD.
# La app que se despliega es la carpeta standalone/ (servidor Node propio):
#   - Arranque: npm start -> node server.js (escucha en $PORT, 0.0.0.0)
#   - Salud:   GET /health (Render la usa para marcar el servicio como vivo)
#   - Datos:   Postgres en Neon vía DATABASE_URL (cadena POOLED, con -pooler)
# La base de datos NO se crea aquí: vive en Neon (Postgres externo).
services:
  - type: web
    name: noche-eterna
    runtime: node
    plan: free
    rootDir: standalone
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
